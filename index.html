&age<8});return '<div class="metricrow"><div class="metric"><b>'+last7.reduce((a,k)=>a+Object.values(tracked[k]).filter(x=>x.done).length,0)+'</b><small>Hábitos terminados · 7 días</small></div><div class="metric"><b>'+Math.round(last7.reduce((a,k)=>a+Object.values(tracked[k]).reduce((b,x)=>b+x.seconds,0),0)/60)+'</b><small>Minutos registrados · 7 días</small></div><div class="metric"><b>'+last7.length+'</b><small>Días con actividad</small></div></div>'+TRACKS.map(t=>{const total=last7.reduce((a,k)=>a+((tracked[k]||{})[t.id]?.seconds||0),0),done=last7.reduce((a,k)=>a+Number(!!(tracked[k]||{})[t.id]?.done),0);return '<div class="row"><div><strong>'+t.icon+' '+esc(t.name)+'</strong><div class="muted">'+done+' días completados</div></div><b>'+Math.round(total/60)+' min</b></div>'}).join('')+'<p class="muted">Estadísticas basadas en cronómetros registrados en este dispositivo. No incluyen actividades que no hayas registrado.</p>'}function trackingSummary(){const done=TRACKS.filter(t=>trackData(t.id).done).length;return '<div class="card"><div class="sectiontop"><h2>Mis objetivos de hoy</h2><span class="eventpill">'+done+' / '+TRACKS.length+' terminados</span></div><div class="muted" id="track-live">'+(activeTrack?esc(TRACKS.find(t=>t.id===activeTrack.id).name)+' · '+formatTime(currentSeconds(activeTrack.id)):'Selecciona una actividad y pulsa Cronómetro')+'</div>'+trackCards()+'</div>'}function view(t){activeTab=t;let html='';if(t==='hoy'){const todayKyiv=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Kyiv',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const todayEvents=googleEvents.filter(e=>{const d=e.allDay?e.start:new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Kyiv',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(e.start));return d===todayKyiv});html=(calendarNotice?'<div class="card" role="status"><b>Actualización de calendario</b><p class="cal-note">'+esc(calendarNotice)+'</p><button onclick="calendarNotice=\'\';view(\'hoy\')">Entendido</button></div>':'')+'<section class="hero"><span class="eyebrow">Tu centro de mando</span><strong>'+todayEvents.length+' eventos de hoy</strong><div class="muted">'+(googleToken?'Sincronizado con Google Calendar · horario Ucrania':'Conecta Google en Calendario para ver tus reuniones reales')+'</div></section><div class="card"><h2>Reuniones y eventos de hoy</h2>'+(todayEvents.length?todayEvents.map(e=>'<div class="gcal"><b>'+esc(e.allDay?'Todo el día':new Intl.DateTimeFormat('es-ES',{timeZone:'Europe/Kyiv',hour:'2-digit',minute:'2-digit'}).format(new Date(e.start)))+'</b><div>'+esc(e.name)+'</div><div class="muted">'+esc(e.calendar)+'</div><span class="eventpill">Pendiente de verificar en Slack</span></div>').join(''):'<p class="muted">'+(googleToken?'No hay eventos visibles para hoy en los calendarios seleccionados.':'Ve a Calendario → Conectar Google. Las citas aparecerán aquí al sincronizar.')+'</p>')+'</div>'+trackingSummary()+'<div class="card"><div class="sectiontop"><h2>Comidas de hoy</h2><button class="tinybutton" onclick="view(\'comidas\')">Ver menú</button></div>'+mealStories()+'</div><div class="card"><h2>Tu entrenamiento</h2>'+trainingPreview()+'</div><div class="card"><h2>Tu rutina</h2><p class="muted">Bloques orientativos; las reuniones reales tienen prioridad.</p>'+rows(agenda,'a')+'</div>'}if(t==='calendario')html='<div class="card"><h2>Google Calendar</h2><p class="muted">'+esc(googleStatus)+'</p><div class="actions"><button onclick="connectGoogle()">Conectar Google</button><button onclick="syncGoogle()">Actualizar</button><button onclick="disconnectGoogle()">Desconectar</button></div><p class="muted">Solo lectura: SEBAS OS nunca modifica tus calendarios. Muestra solo hoy y los próximos 7 días en horario de Ucrania. Los calendarios antiguos B360 y JustSales se excluyen por defecto.</p><h3>Seleccionar calendarios</h3><div>'+calendarChoices.map(c=>'<label class="row"><span>'+esc(c.summary||c.id)+'</span><input type="checkbox" '+((allowedCa +'</div>';if(t==='habitos')html='<div class="card"><h2>Hábitos con cronómetro</h2><p class="muted">Cuando marques Terminado, la actividad cambia de color y deja de estar pendiente.</p>'+trackCards()+'</div>';if(t==='lectura')html='<div class="card"><h2>Lectura diaria</h2><p class="muted">Objetivo: 30 minutos. Inicia el cronómetro, pausa cuando necesites y marca Terminado cuando acabes.</p>'+trackCards(['lectura'])+'</div><div class="card"><h2>Tu progreso lector</h2>'+trackStats()+'</div>';if(t==='estadisticas')html='<div class="card"><h2>Tu progreso real</h2><p class="muted">Tiempo dedicado a cada área durante los últimos siete días.</p>'+trackStats()+'</div>';if(t==='ajustes')html='<div class="card"><h2>Conexiones</h2><p>Google Calendar: '+esc(googleStatus)+'</p><p>Slack: no conectado</p><p>ChatGPT: no conectado</p><p>Notificaciones: no configuradas</p><p class="muted">Tus datos se guardan solo en este dispositivo. No incluyas datos confidenciales de Impulso.</p></div>';document.getElementById('app').innerHTML=html;if(t==='calendario')renderEvents()}function addEvent(){let name=document.getElementById('eventname').value.trim(),date=document.getElementById('eventdate').value;if(!name||!date){alert('Escribe nombre y fecha');return}data.events=data.events||[];data.events.push({name,date});data.events.sort((a,b)=>a.date.localeCompare(b.date));save();renderEvents()}async function importICS(file){if(!file)return;let raw=(await file.text()).replace(/\r?\n[ \t]/g,'');let blocks=raw.split('BEGIN:VEVENT').slice(1);let added=0;data.events=data.events||[];for(let block of blocks){let title=block.match(/^SUMMARY:(.*)$/m)?.[1]?.replace(/\\,/g,',')||'Evento';let dt=block.match(/^DTSTART(?:;[^:\n]*)?:(\d{8}T?\d{0,6})/m)?.[1];if(!dt)continue;let date=dt.slice(0,4)+'-'+dt.slice(4,6)+'-'+dt.slice(6,8)+'T'+(dt.includes('T')?dt.slice(9,11)+':'+dt.slice(11,13):'09:00');if(!data.events.some(e=>e.name===title&&e.date===date)){data.events.push({name:title,date});added++}}data.events.sort((a,b)=>a.date.localeCompare(b.date));save();renderEvents();alert(added+' eventos importados. Verifica las horas: los archivos ICS pueden usar otras zonas horarias.')}function removeEvent(i){data.events.splice(i,1);save();renderEvents()}function renderEvents(){document.getElementById('events').innerHTML=(data.events||[]).map((e,i)=>'<div class="row"><div><b>'+e.date.replace('T',' ')+'</b><div class="muted">'+e.name.replaceAll('<','&lt;')+'</div></div><button onclick="removeEvent('+i+')">Borrar</button></div>').join('')||'<p class="muted">Sin eventos añadidos.</p>'}view('hoy');setInterval(()=>{if(googleToken&&document.visibilityState==='visible')syncGoogle()},300000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&googleToken)syncGoogle()});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></html>
