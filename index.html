r(e=>e.start).sort((a,b)=>a.start.localeCompare(b.start));googleStatus='Conectado · '+googleEvents.length+' eventos · solo lectura';view(activeTab)}catch(e){googleStatus='Error: '+e.message;view('calendario')}}function toggleCalendar(id,on){allowedCalendarIds=allowedCalendarIds||calendarChoices.filter(c=>!/b360agencia|justsales|just.sales/i.test(c.id+' '+c.summary)).map(c=>c.id);allowedCalendarIds=on?[...new Set([...allowedCalendarIds,id])]:allowedCalendarIds.filter(x=>x!==id);localStorage.setItem('sebasAllowedCalendars',JSON.stringify(allowedCalendarIds));syncGoogle()}function disconnectGoogle(){if(googleToken&&window.google?.accounts?.oauth2)google.accounts.oauth2.revoke(googleToken,()=>{});googleToken='';googleEvents=[];googleStatus='Sin conectar';view('calendario')}function googleRows(){return googleEvents.length?googleEvents.map(e=>'<div class="gcal"><b>'+esc(e.allDay?e.start:new Intl.DateTimeFormat('es-ES',{timeZone:'Europe/Kyiv',dateStyle:'medium',timeStyle:'short'}).format(new Date(e.start)))+'</b><div>'+esc(e.name)+'</div><div class="muted">'+esc(e.calendar)+'</div></div>').join(''):'<p class="muted">No hay eventos cargados. Conecta Google para ver tus citas.</p>'}const now=new Date(),day=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Kyiv',year:'numeric',month:'2-digit',day:'2-digit'}).format(now),weekend=[0,6].includes(now.getDay());document.getElementById('date').textContent=new Intl.DateTimeFormat('es-ES',{dateStyle:'full',timeZone:'Europe/Kyiv'}).format(now);const agenda=weekend?[['07:00','Oración'],['07:10','Ejercicio'],['08:10','Desayuno'],['10:00','KLIMB · 3 horas'],['15:00','Inglés y vida personal']]:[['07:00','Oración · 10 minutos'],['07:10','Ejercicio · 40 minutos'],['08:10','Desayuno'],['09:40','Preparación comercial'],['10:00','Daily Impulso (verificar zona horaria)'],['10:30','Llamadas y seguimiento (confirmar en calendario)'],['21:00','Desconexión']];const comidas=[['Antes del desayuno','Banano'],['Desayuno','Cinco huevos con espinacas, ch ntos importados. Verifica las horas: los archivos ICS pueden usar otras zonas horarias.')}function removeEvent(i){data.events.splice(i,1);save();renderEvents()}function renderEvents(){document.getElementById('events').innerHTML=(data.events||[]).map((e,i)=>'<div class="row"><div><b>'+e.date.replace('T',' ')+'</b><div class="muted">'+e.name.replaceAll('<','&lt;')+'</div></div><button onclick="removeEvent('+i+')">Borrar</button></div>').join('')||'<p class="muted">Sin eventos añadidos.</p>'}view('hoy');if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></html>
