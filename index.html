<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><link rel="manifest" href="manifest.webmanifest"><title>SEBAS OS</title><style>body{margin:0;background:#0b1020;color:#f5f7ff;font:16px -apple-system,Arial}header{background:#172743;padding:28px 20px}h1{font-size:30px}main{max-width:700px;margin:auto;padding:16px}.card{background:#172238;border-radius:18px;padding:18px;margin:12px 0}nav{display:flex;overflow:auto;gap:5px;padding:8px;background:#111b30}button{background:#344564;color:white;border:0;border-radius:10px;padding:12px}button:focus{background:#587fff}.row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #354158}.muted{color:#afbdd6;font-size:13px}textarea,input{font-size:16px}textarea{width:100%;box-sizing:border-box;background:#0d172a;color:white;border:1px solid #44516b;border-radius:8px;padding:10px}</style><header><small>SEBAS OS · LVIV</small><h1>¿Qué toca ahora?</h1><div id="date"></div></header><nav><button onclick="view('hoy')">Hoy</button><button onclick="view('calendario')">Calendario</button><button onclick="view('comidas')">Comidas</button><button onclick="view('gym')">Gimnasio</button><button onclick="view('habitos')">Hábitos</button><button onclick="view('ajustes')">Ajustes</button></nav><main id="app"></main><script>const now=new Date(),day=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Kyiv',year:'numeric',month:'2-digit',day:'2-digit'}).format(now),weekend=[0,6].includes(now.getDay());document.getElementById('date').textContent=new Intl.DateTimeFormat('es-ES',{dateStyle:'full',timeZone:'Europe/Kyiv'}).format(now);const agenda=weekend?[['07:00','Oración'],['07:10','Ejercicio'],['08:10','Desayuno'],['10:00','KLIMB · 3 horas'],['15:00','Inglés y vida personal']]:[['07:00','Oración · 10 minutos'],['07:10','Ejercicio · 40 minutos'],['08:10','Desayuno'],['09:40','Preparación comercial'],['10:00','Daily Impulso (verificar zona horaria)'],['10:30','Llamadas y seguimiento (confirmar en calendario)'],['21:00','Desconexión']];const comidas=[['Antes del desayuno','Banano'],['Desayuno','Cinco huevos con espinacas, champiñones y tomates cherry; tostada con mantequilla de cacahuate y café con leche'],['Almuerzo','Pollo, arroz, verduras y aguacate'],['Merienda','Yogur griego, arándanos, granola y banano'],['Cena','Salmón, patatas y verduras']];const habits=['Oración','Ejercicio','Lectura 25–30 min','Inglés 60 min','Seguimientos Impulso','Descanso'];const data=JSON.parse(localStorage.getItem('sebasos')||'{}');function save(){localStorage.setItem('sebasos',JSON.stringify(data))}function rows(arr,prefix){return arr.map((x,i)=>{let k=day+prefix+i;return '<div class="row"><div><b>'+x[0]+'</b><div class="muted">'+(x[1]||'')+'</div></div><input aria-label="Completar" type="checkbox" '+(data[k]?'checked':'')+' onchange="data[\''+k+'\']=this.checked;save()"></div>'}).join('')}function view(t){let html='';if(t==='hoy')html='<div class="card"><h2>Agenda de hoy</h2><p class="muted">Horario orientativo en Kyiv. No está conectado a Google Calendar; verifica todas las llamadas.</p>'+rows(agenda,'a')+'</div>';if(t==='calendario')html='<div class="card"><h2>Calendario local</h2><p class="muted">Añade tus citas reales manualmente. Todavía no hay sincronización con Google. Horas de Ucrania (Europe/Kyiv).</p><label>Fecha y hora <input id="eventdate" type="datetime-local"></label><p><label>Evento <input id="eventname" placeholder="Llamada / reunión"></label></p><p><button onclick="addEvent()">Añadir evento</button></p><div id="events"></div><hr><h3>Importar calendario</h3><p class="muted">Importa un archivo .ics exportado de Google Calendar. Se procesa solo en este iPhone; no se sube al servidor. Revisa las horas después de importar.</p><input type="file" accept=".ics,text/calendar" onchange="importICS(this.files[0])"><p><a style="color:#a9c4ff" href="https://calendar.google.com/calendar/u/0/r" target="_blank" rel="noopener">Abrir Google Calendar</a></p></div>';if(t==='comidas')html='<div class="card"><h2>Comidas de hoy</h2>'+rows(comidas,'m')+'</div>';if(t==='gym')html='<div class="card"><h2>Entrenamiento</h2><p>Rutina inicial editable</p><textarea rows="7" id="routine">'+(data.routine||'Sentadillas 3 × 8\nFlexiones 3 × 10\nRemo con mancuerna 3 × 10\nPlancha 3 × 30 segundos')+'</textarea><p><button onclick="data.routine=document.getElementById(\'routine\').value;save()">Guardar</button></p>'+rows([['Entrenamiento completado','']], 'g')+'</div>';if(t==='habitos')html='<div class="card"><h2>Hábitos</h2>'+rows(habits.map(x=>[x,'']),'h')+'</div>';if(t==='ajustes')html='<div class="card"><h2>Conexiones</h2><p>Google Calendar: no conectado</p><p>Slack: no conectado</p><p>ChatGPT: no conectado</p><p>Notificaciones: no configuradas</p><p class="muted">Tus datos se guardan solo en este dispositivo. No incluyas datos confidenciales de Impulso.</p></div>';document.getElementById('app').innerHTML=html;if(t==='calendario')renderEvents()}function addEvent(){let name=document.getElementById('eventname').value.trim(),date=document.getElementById('eventdate').value;if(!name||!date){alert('Escribe nombre y fecha');return}data.events=data.events||[];data.events.push({name,date});data.events.sort((a,b)=>a.date.localeCompare(b.date));save();renderEvents()}async function importICS(file){if(!file)return;let raw=(await file.text()).replace(/\r?\n[ \t]/g,'');let blocks=raw.split('BEGIN:VEVENT').slice(1);let added=0;data.events=data.events||[];for(let block of blocks){let title=block.match(/^SUMMARY:(.*)$/m)?.[1]?.replace(/\\,/g,',')||'Evento';let dt=block.match(/^DTSTART(?:;[^:\n]*)?:(\d{8}T?\d{0,6})/m)?.[1];if(!dt)continue;let date=dt.slice(0,4)+'-'+dt.slice(4,6)+'-'+dt.slice(6,8)+'T'+(dt.includes('T')?dt.slice(9,11)+':'+dt.slice(11,13):'09:00');if(!data.events.some(e=>e.name===title&&e.date===date)){data.events.push({name:title,date});added++}}data.events.sort((a,b)=>a.date.localeCompare(b.date));save();renderEvents();alert(added+' eventos importados. Verifica las horas: los archivos ICS pueden usar otras zonas horarias.')}function removeEvent(i){data.events.splice(i,1);save();renderEvents()}function renderEvents(){document.getElementById('events').innerHTML=(data.events||[]).map((e,i)=>'<div class="row"><div><b>'+e.date.replace('T',' ')+'</b><div class="muted">'+e.name.replaceAll('<','&lt;')+'</div></div><button onclick="removeEvent('+i+')">Borrar</button></div>').join('')||'<p class="muted">Sin eventos añadidos.</p>'}view('hoy');if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></html>
