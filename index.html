/accounts.google.com/gsi/client" async defer></script><script>const GOOGLE_CLIENT_ID='240020943647-8tgmbklk9ll3prdmlt5b8m321dibcpib.apps.googleusercontent.com';let googleToken='',googleClient=null,googleEvents=[],googleStatus='Sin conectar';let calendarChoices=[],allowedCalendarIds=JSON.parse(localStorage.getItem('sebasAllowedCalendars')||'null');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function connectGoogle(){if(!window.google?.accounts?.oauth2){googleStatus='Google todavía está cargando. Prueba de nuevo.';view('calendario');return}googleClient=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:'https://www.googleapis.com/auth/calendar.readonly',callback:async response=>{if(response.error){googleStatus='No se pudo autorizar: '+response.error;view('calendario');return}googleToken=response.access_token;googleStatus='Conectado · solo lectura';await syncGoogle()}});googleClient.requestAccessToken({prompt:'consent'})}async function syncGoogle(){if(!googleToken){connectGoogle();return}googleStatus='Actualizando calendarios…';view('calendario');try{const headers={Authorization:'Bearer '+googleToken};const get=async url=>{let r=await fetch(url,{headers});if(!r.ok)throw Error('Google respondió '+r.status+(r.status===401?' · vuelve a conectar':''));return r.json()};let calendars=[],page='';do{let j=await get('https://www.googleapis.com/calendar/v3/users/me/calendarList?maxResults=250'+(page?'&pageToken='+encodeURIComponent(page):''));calendars.push(...(j.items||[]));page=j.nextPageToken||''}while(page);const start=new Date();start.setHours(0,0,0,0);const end=new Date();end.setDate(end.getDate()+7);calendarChoices=calendars;const results=await Promise.all(calendars.filter(c=>c.selected!==false&&(allowedCalendarIds?allowedCalendarIds.includes(c.id):!/b360agencia|justsales|just.sales/i.test(c.id+' '+c.summary))).map(async c=>{try{let ev=[],p='';do{let u='https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(c.id)+'/events?singleEvents=true&orderBy=startTime&maxResults=250&timeMin='+encodeURIComponent(start.toISOString())+'&timeMax='+encodeURIComponent(end.toISOString())+(p?'&pageToken='+encodeURIComponent(p):'');let j=await get(u);ev.push(...(j.items||[]));p=j.nextPageToken||''}while(p);return ev.map(e=>({name:e.summary||'Ocupado',start:e.start?.dateTime||e.start?.date,calendar:c.summary||'Calendario',allDay:!e.start?.dateTime}))}catch(e){return []}}));googleEvents=results.flat().filter(e=>e.start).sort((a,b)=>a.start.localeCompare(b.start));googleStatus='Conectado · '+googleEvents.length+' eventos · solo lectura';view('calendario')}catch(e){googleStatus='Error: '+e.message;view('calendario')}}function toggleCalendar(id,on){allowedCalendarIds=allowedCalendarIds||calendarChoices.filter(c=>!/b360agencia|justsales|just.sales/i.test(c.id+' '+c.summary)).map(c=>c.id);allowedCalendarIds=on?[...new Set([...allowedCalendarIds,id])]:allowedCalendarIds.filter(x=>x!==id);localStorage.setItem('sebasAllowedCalendars',JSON.stringify(allowedCalendarIds));syncGoogle()}function disconnectGoogle(){if(googleToken&&window.google?.accounts?.oauth2)google.accounts.oauth2.revoke(googleToken,()=>{});googleToken='';googleEvents=[];googleStatus='Sin conectar';view('calendario')}function googleRows(){return googleEvents.length?googleEvents.map(e=>'<div class="gcal"><b>'+esc(e.allDay?e.start:new Intl.DateTimeFormat('es-ES',{timeZone:'Europe/Kyiv',dateStyle:'medium',timeStyle:'short'}).format(new Date(e.start)))+'</b><div>'+esc(e.name)+'</div><div class="muted">'+esc(e.calendar)+'</div></div>').join(''):'<p class="muted">No hay eventos cargados. Conecta Google para ver tus citas.</p>'}const now=new Date(),day=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Kyiv',year:'numeric',month:'2-digit',day:'2-digit'}).format(now),weekend=[0,6].includes(now.getDay());document.getElementById('date').textContent=new Intl.DateTimeFormat('es-ES',{dateStyle:'full',timeZone:'Europe/Kyiv'}).format(now);const agenda=weekend?[['07:00','Oración'],['07:10','Ejercicio'],['08:10','Desayuno'],['10:00','KLIMB · 3 horas'],['15:00','Inglés y vida personal']]:[['07:00','Oración · 10 minutos'],['07:10','Ejercicio · 40 minutos'],['08:10','Desayuno'],['09:40','Preparación comercial'],['10:00','Daily Impulso (verificar zona horaria)'],['10:30','Llamadas y seguimiento (confirmar en calendario)'],['21:00','Desconexión']];const comidas=[['Antes del desayuno','Banano'],['Desayuno','Cinco huevos con espinacas, champiñones y tomates cherry; tostada con mantequilla de cacahuate y café con leche'],['Almuerzo','Pollo, arroz, verduras y aguacate'],['Merienda','Yogur griego, arándanos, granola y banano'],['Cena','Salmón, patatas y verduras']];const habits=['Oración','Ejercicio','Lectura 25–30 min','Inglés 60 min','Seguimientos Impulso','Descanso'];const data=JSON.parse(localStorage.getItem('sebasos')||'{}');function save(){localStorage.setItem('sebasos',JSON.stringify(data))}function rows(arr,prefix){return arr.map((x,i)=>{let k=day+prefix+i;return '<div class="row"><div><b>'+x[0]+'</b><div class="muted">'+(x[1]||'')+'</div></div><input aria-label="Completar" type="checkbox" '+(data[k]?'checked':'')+' onchange="data[\''+k+'\']=this.checked;save()"></div>'}).join('')}function view(t){let html='';if(t==='hoy')html='<div class="card"><h2>Agenda de hoy</h2><p class="muted">Horario orientativo en Kyiv. Consulta Calendario para ver tus citas reales; verifica la confirmación de llamadas.</p>'+rows(agenda,'a')+'</div>';if(t==='calendario')html='<div class="card"><h2>Google Calendar</h2><p class="muted">'+esc(googleStatus)+'</p><button onclick="connectGoogle()">Conectar Google</button> <button onclick="syncGoogle()">Actualizar</button> <button onclick="disconnectGoogle()">Desconectar</button><p class="muted">Solo lectura: SEBAS OS nunca modifica tus calendarios. Muestra solo hoy y los próximos 7 días en horario de Ucrania. Los calendarios antiguos B360 y JustSales se excluyen por defecto.</p><h3>Seleccionar calendarios</h3><div>'+calendarChoices.map(c=>'<label class="row"><span>'+esc(c.summary||c.id)+'</span><input type="checkbox" '+((allowedCalendarIds?allowedCalendarIds.includes(c.id):!/b360agencia|justsales|just.sales/i.test(c.id+' '+c.summary))?'checked':'')+' onchange="toggleCalendar('+JSON.stringify(c.id).replace(/\"/g,'&quot;')+',this.checked)"></label>').join('')+'</div><div>'+googleRows()+'</div></div><div class="card"><h2>Calendario local</h2><p class="muted">Añade tus citas reales manualmente. Todavía no hay sincronización con Google. Horas de Ucrania (Europe/Kyiv).</p><label>Fecha y hora <input id="eventdate" type="datetime-local"></label><p><label>Evento <input id="eventname" placeholder="Llamada / reunión"></label></p><p><button onclick="addEvent()">Añadir evento</button></p><div id="events"></div><hr><h3>Importar calendario</h3><p class="muted">Importa un archivo .ics exportado de Google Calendar. Se procesa solo en este iPhone; no se sube al servidor. Revisa las horas después de importar.</p><input type="file" accept=".ics,text/calendar" onchange="importICS(this.files[0])"><p><a style="color:#a9c4ff" href="https://calendar.google.com/calendar/u/0/r" target="_blank" rel="noopener">Abrir Google Calendar</a></p></div>';if(t==='comidas')html='<div class="card"><h2>Comidas de hoy</h2>'+rows(comidas,'m')+'</div>';if(t==='gym')html='<div class="card"><h2>Entrenamiento</h2><p>Rutina inicial editable</p><textarea rows="7" id="routine">'+(data.routine||'Sentadillas 3 × 8\nFlexiones 3 × 10\nRemo con mancuerna 3 × 10\nPlancha 3 × 30 segundos')+'</textarea><p><button onclick="data.routine=document.getElementById(\'routine\').value;save()">Guardar</button></p>'+rows([['Entrenamiento completado','']], 'g')+'</div>';if(t==='habitos')html='<div class="card"><h2>Hábitos</h2>'+rows(habits.map(x=>[x,'']),'h')+'</div>';if(t==='ajustes')html='<div class="card"><h2>Conexiones</h2><p>Google Calendar: '+esc(googleStatus)+'</p><p>Slack: no conectado</p><p>ChatGPT: no conectado</p><p>Notificaciones: no configuradas</p><p class="muted">Tus datos se guardan solo en este dispositivo. No incluyas datos confidenciales de Impulso.</p></div>';document.getElementById('app').innerHTML=html;if(t==='calendario')renderEvents()}function addEvent(){let name=document.getElementById('eventname').value.trim(),date=document.getElementById('eventdate').value;if(!name||!date){alert('Escribe nombre y fecha');return}data.events=data.events||[];data.events.push({name,date});data.events.sort((a,b)=>a.date.localeCompare(b.date));save();renderEvents()}async function importICS(file){if(!file)return;let raw=(await file.text()).replace(/\r?\n[ \t]/g,'');let blocks=raw.split('BEGIN:VEVENT').slice(1);let added=0;data.events=data.events||[];for(let block of blocks){let title=block.match(/^SUMMARY:(.*)$/m)?.[1]?.replace(/\\,/g,',')||'Evento';let dt=block.match(/^DTSTART(?:;[^:\n]*)?:(\d{8}T?\d{0,6})/m)?.[1];if(!dt)continue;let date=dt.slice(0,4)+'-'+dt.slice(4,6)+'-'+dt.slice(6,8)+'T'+(dt.includes('T')?dt.slice(9,11)+':'+dt.slice(11,13):'09:00');if(!data.events.some(e=>e.name===title&&e.date===date)){data.events.push({name:title,date});added++}}data.events.sort((a,b)=>a.date.localeCompare(b.date));save();renderEvents();alert(added+' eventos importados. Verifica las horas: los archivos ICS pueden usar otras zonas horarias.')}function removeEvent(i){data.events.splice(i,1);save();renderEvents()}function renderEvents(){document.getElementById('events').innerHTML=(data.events||[]).map((e,i)=>'<div class="row"><div><b>'+e.date.replace('T',' ')+'</b><div class="muted">'+e.name.replaceAll('<','&lt;')+'</div></div><button onclick="removeEvent('+i+')">Borrar</button></div>').join('')||'<p class="muted">Sin eventos añadidos.</p>'}view('hoy');if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></html>
